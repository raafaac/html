
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lana Del Rey — Fan Experience</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <h1>🍒Lana Del Rey</h1>
    <h2>Fan Experience</h2>
    <p>
        Um encontro fictício para fãs da Lana Del Rey!
        Preencha o formulário para participar.
    </p>

    <form action="obrigado.html" method="get">

        <fieldset>
            <legend>Seus dados</legend>

            <p>
                <label for="nome">Nome completo *</label>
                <input class="campo" type="text" id="nome"
                       name="nome" minlength="3" required>
            </p>

            <p>
                <label for="email">E-mail *</label>
                <input class="campo" type="email" id="email"
                       name="email" placeholder="voce@email.com" required>
            </p>

            <p>
                <label for="idade">Idade *</label>
                <input class="campo" type="number" id="idade"
                       name="idade" min="13" max="100" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>Seu lado fã</legend>

            <p>
                <label for="album">Álbum favorito *</label>
                <select class="campo" id="album" name="album" required>
                    <option value="">Selecione um álbum</option>
                    <option value="born-to-die">Born to Die</option>
                    <option value="ultraviolence">Ultraviolence</option>
                    <option value="honeymoon">Honeymoon</option>
                    <option value="lust-for-life">Lust for Life</option>
                    <option value="norman-fucking-rockwell">Norman Fucking Rockwell!</option>
                    <option value="chemtrails">Chemtrails Over the Country Club</option>
                    <option value="blue-banisters">Blue Banisters</option>
                    <option value="ocean-blvd">Did You Know That There's a Tunnel Under Ocean Blvd</option>
                </select>
            </p>

            <p>
                <label for="musica">Música favorita *</label>
                <input class="campo" type="text" id="musica"
                       name="musica" placeholder="Ex.: Young and Beautiful" required>
            </p>

            <p>
                <label for="tempo">Há quanto tempo você é fã?</label>
                <select class="campo" id="tempo" name="tempo">
                    <option value="recentemente">Comecei recentemente</option>
                    <option value="1-3-anos">Há 1 a 3 anos</option>
                    <option value="4-7-anos">Há 4 a 7 anos</option>
                    <option value="mais-de-7-anos">Há mais de 7 anos</option>
                </select>
            </p>
        </fieldset>

        <fieldset>
            <legend>Sobre o evento</legend>

            <p>
                <label for="data">Data de preferência *</label>
                <input class="campo" type="date" id="data"
                       name="data" required>
            </p>

            <p>Qual atividade você gostaria de aproveitar?</p>

            <p>
                <input type="radio" id="atividade-musica"
                       name="atividade" value="musica" checked>
                <label for="atividade-musica">Quiz musical</label>
            </p>

            <p>
                <input type="radio" id="atividade-albuns"
                       name="atividade" value="albuns">
                <label for="atividade-albuns">Conversa sobre os álbuns</label>
            </p>

            <p>
                <input type="radio" id="atividade-estetica"
                       name="atividade" value="estetica">
                <label for="atividade-estetica">Fotos e estética vintage</label>
            </p>

            <p>
                <label for="observacoes">Conte algo sobre você e a Lana</label>
                <textarea class="campo" id="observacoes"
                          name="observacoes" rows="4"
                          placeholder="Qual música dela significa muito para você?"></textarea>
            </p>
        </fieldset>

        <p>
            <input type="checkbox" id="novidades"
                   name="novidades" value="sim">
            <label for="novidades">
                Quero receber novidades sobre o evento.
            </label>
        </p>

        <p>
            <button class="btn-enviar" type="submit">
                Enviar inscrição
            </button>

            <button class="btn-limpar" type="reset">
                Limpar formulário
            </button>
        </p>

    </form>

</body>
</html>
